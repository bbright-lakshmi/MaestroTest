appId: com.rupee.template_one
---
- launchApp
- tapOn: "Search Stores"
- inputText: "Boutique"
- assertVisible: "Boutique\nnellore, A.P"
- tapOn: "Boutique\nnellore, A.P"
- tapOn: "Search"
- tapOn: "Search Products"
- inputText : "non returnable kit"
- tapOn:
    id: "com.google.android.inputmethod.latin:id/0_resource_name_obfuscated"
    index: 56
- tapOn: "Count 1\nnon returnable kit\nx 1\n₹30"
- assertVisible: "₹30"
- tapOn: "Add to bag"
- assertVisible: "Success\nItem added to cart"
- assertVisible: "Cart\n1"
- tapOn: "Cart\n1"
- assertVisible: "non returnable kit\n x 1\n₹30"
- assertVisible: "Cart Total (1 Item)

    ₹30

    Delivery/Package

    ₹86.45

    Discount

    ₹0

    Coupon

    ₹0

    Total Savings

    ₹0

    Tax

    ₹0

    Pay

    ₹116.45"
- tapOn: "Pay Using"
- tapOn: "Cash On Delivery\nCash On Delivery"  
- assertVisible: "Cash On Delivery"
- tapOn: "Total\n₹116.45\nPlace Order"
- assertVisible: "Success\nOrder placed successfully"
- tapOn: "Profile"
- tapOn: "My Orders"
- tapOn: "View Order Summary"
- assertVisible: "Process\nnon returnable kit\n₹30"
- tapOn: "Cancel"
- extendedWaitUntil:
    visible:
      point: "50%,29%"
    timeout: 5000      
- takeScreenshot: Images/Template1/NonReturnableKit