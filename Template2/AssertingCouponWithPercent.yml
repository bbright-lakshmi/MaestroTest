appId: com.rupee.template_two
---
- launchApp
- tapOn: "Search Stores"
- inputText: "Boutique"
- assertVisible: "Boutique\nnellore, A.P"
- tapOn: "Boutique\nnellore, A.P"
- tapOn: "Search"
- tapOn: "Search Products"
- inputText: "exclusive tax"
- tapOn:
    id: "com.google.android.inputmethod.latin:id/0_resource_name_obfuscated"
    index: 56
- tapOn: "Count 1\nExclusive tax\nx 1\n₹40"
- assertVisible: "₹40"
- tapOn: "Add to bag"
- assertVisible: "Cart\n1"
- tapOn: "Cart\n1"
- tapOn: "Please select coupon\nCoupon"
- tapOn: "5 %

    OFF

    Boutique

    Coupon Code

    FHFHFFHG

    Cart Amount ₹10

    Expire - Apr 29, 2025"
- tapOn: "Scrim"
- assertVisible: "FHFHFFHG"
- scrollUntilVisible:
    element: "Note: Cancellation must be requested 24 hours prior."
    direction: DOWN
- tapOn: "Cash On Delivery"
- tapOn: "Place Order"
- tapOn: "Profile"
- tapOn: "My Orders"
- tapOn: "View Order Summary"
- tapOn: "Process\nExclusive tax\n₹41.20"
- scrollUntilVisible:
    element: "Note:Cancellation must be requested 24 hours prior."
    direction: DOWN
