appId: com.rupee.template_two
---
- launchApp
- tapOn: "Search Stores"
- inputText: "Boutique"
- assertVisible: "Boutique\nnellore, A.P"
- tapOn: "Boutique\nnellore, A.P"
- tapOn: "Search"
- tapOn: "Search Products"
- inputText: "inclusive tax"
- tapOn:
    id: "com.google.android.inputmethod.latin:id/0_resource_name_obfuscated"
    index: 56
- tapOn: "Count 2\nInclusive tax\n₹22.44"
- assertVisible: "₹22.44"
- tapOn: "Add to bag"
- assertVisible: "Cart\n1"
- tapOn: "Cart\n1"
- assertVisible: "Cart Total (1 Item)

    ₹22.44

    Delivery/Package

    ₹86.45

    Discount

    ₹0

    Coupon

    ₹0

    Total Savings

    ₹0

    Tax

    ₹0

    Pay

    ₹108.89"
- scrollUntilVisible:
    element: "Note: Cancellation must be requested 24 hours prior."
    direction: DOWN
- tapOn: "Cash On Delivery"
- tapOn: "Place Order"
- tapOn: "Profile"
- tapOn: "My Orders"
- tapOn: "View Order Summary"
- assertVisible: "Process\nInclusive tax\n₹22.44"