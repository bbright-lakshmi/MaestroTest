appId: com.rupee.template_two
---
- launchApp
- tapOn: "Search Stores"
- inputText: "Boutique"
- assertVisible: "Boutique\nnellore, A.P"
- tapOn: "Boutique\nnellore, A.P"
- tapOn: "Search"
- tapOn: "Search Products"
- inputText : "returnable kit"
- tapOn:
    id: "com.google.android.inputmethod.latin:id/0_resource_name_obfuscated"
    index: 56
- tapOn: "Count 1\nreturnable kit\n₹40"
- tapOn: "Add to bag"
- assertVisible: "Success\nItem added to cart"
- assertVisible: "Cart\n1"
- tapOn: "Cart\n1"
- assertVisible: "returnable kit\n x 1\n₹40"
- scrollUntilVisible:
    element: "Note:Cancellation must be requested 24 hours prior."
    direction: DOWN
- tapOn: "Cash On Delivery"
- tapOn: "Place Order"
- assertVisible: "Success\nOrder placed successfully"
- tapOn: "Profile"
- tapOn: "My Orders"
- tapOn: "View Order Summary"
- assertVisible: "Process\nreturnable kit\n₹40"
- tapOn: "Cancel"
- tapOn: "Yes"
- extendedWaitUntil:
    visible:
      point: "19%,25%"
    timeout: 5000      
- takeScreenshot: Images/Template2/ReturnableKit