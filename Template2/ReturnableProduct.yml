appId: com.rupee.template_two
---
- launchApp
- tapOn: "Search Stores"
- inputText: "Boutique"
- assertVisible: "Boutique\nnellore, A.P"
- tapOn: "Boutique\nnellore, A.P"
- tapOn: "Search"
- tapOn: "Search Products"
- inputText : "returnable"
- tapOn: "returnable"
- tapOn: "soch\nreturnable\n1f x 1\n₹33.66"
- assertVisible: "₹33.66"
- tapOn: "Add to bag"
- assertVisible: "Success\nItem added to cart"
- assertVisible: "Cart\n1"
- tapOn: "2f"
- assertVisible: "₹56"
- tapOn: "Add to bag"
- assertVisible: "Success\nItem added to cart"
- assertVisible: "Cart\n2"
- tapOn: "3f"
- assertVisible: "₹69"
- tapOn: "Add to bag"
- assertVisible: "Success\nItem added to cart"
- assertVisible: "Cart\n3"
- tapOn: "Cart\n3"
- assertVisible: "returnable\n1f x 1\n₹33.66"
- assertVisible: "returnable\n2f x 1\n₹56"
- assertVisible: "returnable\n3f x 1\n₹69"
- scrollUntilVisible:
    element: "Cash On Delivery"
    direction: DOWN
- tapOn: "Cash On Delivery"
- tapOn: "Place Order"
- assertVisible: "Success\nOrder placed successfully"
- tapOn: "Profile"
- tapOn: "My Orders"
- tapOn:
    point: "19%,25%"
- assertVisible: "Process\nreturnable\n₹33.66"
- assertVisible: "Process\nreturnable\n₹56"
- assertVisible: "Process\nreturnable\n₹69"
- tapOn: "Cancel"
- tapOn: "Yes"
- assertVisible: "Info\nItem canceled successfully."
