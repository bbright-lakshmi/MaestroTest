appId: com.rupee.template_three
---
- launchApp
- tapOn: "Search Stores"
- inputText: "Boutique"
- tapOn: "Boutique\nnellore, A.P"
- extendedWaitUntil:
    visible: "Search..."
    timeout: 5000      
- takeScreenshot: Images/Template3/AddingItemsToCartWhenStoreIsInactiveMessage
- tapOn: "Search"
- tapOn: "Search Products"
- inputText: "exclusive tax"
- tapOn:
    id: "com.google.android.inputmethod.latin:id/0_resource_name_obfuscated"
    index: 56
- tapOn: "Count 1\nExclusive tax\nx 1\n₹40"
- tapOn: "Add to bag"
- assertVisible: "Store is currently inactive, please try again later."