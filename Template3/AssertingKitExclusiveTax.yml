appId: com.rupee.template_three
---
- launchApp
- tapOn: "Search Stores"
- inputText: "Boutique"
- assertVisible: "Boutique\nnellore, A.P"
- tapOn: "Boutique\nnellore, A.P"
- tapOn: "Search"
- tapOn: "Search Products"
- inputText: "exclusive tax"
- tapOn: "Exclusive tax"
- tapOn: "Count 1\nExclusive tax\n1 x 1\n₹40"
- tapOn: "Add to bag"
- assertVisible: "Cart\n1"
- tapOn: "Cart\n1"
- scrollUntilVisible:
    element: "Pay"
    direction: DOWN
- assertVisible: "Tax"
- assertVisible: "₹1.20"
- tapOn: "Proceed to checkout"
- tapOn: "Cash On Delivery"
- tapOn: "Place Order"
- tapOn: "Profile"
- tapOn: "My Orders"
- tapOn: "View Order Summary"
- assertVisible: "Process\nExclusive tax\n₹41.20"