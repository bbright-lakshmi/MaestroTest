appId: com.rupee.template_three
---
- launchApp
- tapOn: "Search Stores"
- inputText: "Store Name 2"
- tapOn: "Store Name 2\nAndhra Pradesh, India"
- tapOn: "Search"
- tapOn: "Search Products"
- inputText: "InclusiveTax"
- tapOn: "InclusiveTax"
- tapOn: "Add to bag"
- assertVisible: "InclusiveTax\n x 1\n₹10.20"
- scrollUntilVisible:
    element: "Pay"
    direction: DOWN
- assertVisible: "Cart Total (1 Item)

    ₹10.20

    Delivery/Package

    ₹2586.85

    Discount

    ₹0

    Coupon

    ₹0

    Total Savings

    ₹0

    Tax

    ₹0

    Pay

    ₹2597.05"
- tapOn: "Cash On Delivery"
- tapOn: "Place Order"
- assertVisible: "Success\nOrder placed successfully"
- tapOn: "Profile"
- tapOn: "My Orders"
- extendedWaitUntil:
    visible: "View Order Summary"
    timeout: 5000      
- takeScreenshot: Images/Template3/InclusiveTax
