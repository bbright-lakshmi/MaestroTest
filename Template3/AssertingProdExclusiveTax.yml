appId: com.rupee.template_three
---
- launchApp
- tapOn: "Search Stores"
- inputText: "Boutique"
- assertVisible: "Boutique\nnellore, A.P"
- tapOn: "Boutique\nnellore, A.P"
- tapOn: "Search"
- tapOn: "Search Products"
- inputText : "non returnable"
- tapOn:
    id: "com.google.android.inputmethod.latin:id/0_resource_name_obfuscated"
    index: 52
- assertVisible: "hod\nnon returnable\nx 1\n₹21"
- tapOn: "hod\nnon returnable\nx 1\n₹21"
- assertVisible: "₹21"
- tapOn: "Add to bag"
- assertVisible: "Success\nItem added to cart"
- tapOn: "Cart\n1"
- scrollUntilVisible:
    element: "Pay"
