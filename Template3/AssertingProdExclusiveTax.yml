appId: com.rupee.template_three
---
- launchApp
- tapOn: "Search Stores"
- inputText: "Store Name 2"
- tapOn: "Store Name 2\nAndhra Pradesh, India"
- tapOn: "Search"
- tapOn: "Search Products"
- inputText : "returnable"
- tapOn: "Returnable"
- tapOn: "Add to bag"
- assertVisible: "Cart\n1"
- tapOn: "Cart\n1"
- scrollUntilVisible:
    element: "Pay"
    direction: DOWN
- assertVisible: "Cart Total (1 Item)

    ₹20

    Delivery/Package

    ₹2593.35

    Discount

    ₹0

    Coupon

    ₹0

    Total Savings

    ₹0

    Tax

    ₹1

    Pay

    ₹2614.35"
- tapOn: "Cash On Delivery"
- tapOn: "Place Order"
- assertVisible: "Success\nOrder placed successfully"
- tapOn: "Profile"
- tapOn: "My Orders"
- extendedWaitUntil:
    visible: "View Order Summary"
    timeout: 5000      
- takeScreenshot: Images/Template3/ProductExclusiveTax

