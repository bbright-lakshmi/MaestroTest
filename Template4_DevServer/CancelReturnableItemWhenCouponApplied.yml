appId: com.rupee.template_four
---
- launchApp
- tapOn: "Store name or a product..."
- tapOn: "Search Products"
- inputText: "handcrafts"
- tapOn: "HandCrafts\n0.0\nRK Beach Road"
- tapOn: "Search Products"
- inputText: "pendants ex return"
- tapOn: "Pendants EX Return"
- tapOn: "pa

    Handcrafts

    Pendants EX Return

    ₹10"
- tapOn: "Add To Cart"
- tapOn: "ra2"
- tapOn: "Add To Cart"
- tapOn: "2\nCart"
- assertVisible: "Pendants EX Return\nra 1 x 1\n₹10"
- assertVisible: "Pendants EX Return\nra 2 x 1\n₹19"
- tapOn: "Apply Coupons"
- tapOn: "₹3

    COUPONRP

    Tap To Apply

    Expire - May 23, 2025

    Cart Amount ₹20

    HandCrafts"
- tapOn: "Pay via\nSelect payment mode"
- tapOn: "Cash On Delivery"
- tapOn:
    point: "6%,7%"
- tapOn: "Place Order"
- tapOn: "Settings"
- tapOn: "My Orders"
- tapOn: "View Order Summary"
- assertVisible: "Process\nPendants EX Return\n₹10.20"
- assertVisible: "Process\nPendants EX Return\n₹19.20"
- tapOn: "Cancel"
- assertVisible: "Coupon Applied"
- assertVisible: "A coupon has been applied to this order. The entire order must be canceled. Do you want to cancel the entire order?"