appId: com.rupee.template_four
---
- launchApp
#Allow Notifications
- tapOn:
    id: "com.android.permissioncontroller:id/permission_allow_button"
#Login page
- tapOn: "Enter Name"
- inputText: "Xyz"
- tapOn: "Enter Phone Number"
- inputText: "9182118702"
- tapOn: "Send OTP"
#Otp page
- tapOn:
    id: "android:id/action0"
    index: 0
- tapOn:
    point: "50%,51%"
- tapOn:
    id: "com.google.android.inputmethod.latin:id/0_resource_name_obfuscated"
    index: 3
- tapOn: "Verify & Next"
#- tapOn: "Skip"
#Onboarding Pages
- repeat:
    times: 2
    commands:
      - tapOn:
          point: "77%,95%"
#GrantPermission
- tapOn: "Grant Permission"
- tapOn:
    id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button"