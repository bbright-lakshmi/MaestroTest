appId: com.rupee.template_four
---
- launchApp
- tapOn: "Settings"
- tapOn: "My Addresses"
- assertVisible: "No Delivery Address Found"
- tapOn: "Add New Address"
- tapOn: "First name"
- inputText: "Serving"
- scrollUntilVisible:
    element: "Save"
    direction: DOWN
- tapOn: "Last name"
- inputText: "Zone"
- tapOn: "Phone number"
- inputText: "9876543210"
- tapOn: "Full address"
- inputText: "Serving Zone"
- tapOn: "City name"
- inputText: "Nellore"
- tapOn: "Pin code"
- inputText: "524004"
- tapOn: "Save"
- assertVisible: "Serving Zone, Nellore\n9876543210"