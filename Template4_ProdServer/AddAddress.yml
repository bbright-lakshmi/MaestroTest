appId: com.rupee.template_four
---
- launchApp
- tapOn: "Settings"
- tapOn: "My Addresses"
- assertVisible: "No Delivery Address Found"
- tapOn: "Add New Address"
- tapOn: "CONFIRM LOCATION"
- tapOn: "First name"
- inputText: "Serving"
- tapOn: "Last name"
- inputText: "Zone"
- tapOn: "Phone number"
- inputText: "9876543210"
- tapOn: "MDR"
- eraseText: 50
- inputText: "Serving Zone"
- scrollUntilVisible:
    element: "Save"
    direction: DOWN
- assertVisible: "Nellore"
- tapOn: "Pin code"
- inputText: "524004"
- tapOn: "Save"
- assertVisible: "Serving Zone

    Serving Zone

    9876543210"