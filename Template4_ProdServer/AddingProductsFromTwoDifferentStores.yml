appId: com.rupee.template_four
---
- launchApp
- tapOn: "Store name or a product..."
- tapOn: " Products\ \nTab 3 of 3"
#Store1
- tapOn: "Search Products"
- inputText: "dream catcher"
- tapOn: "Dream Catcher"
- tapOn: "Handcrafts\nDream Catcher\n₹63.40"
- tapOn: "Add To Cart"
- tapOn:
    point: "6%,7%"
#Store2
- tapOn: "Search Products"
- eraseText: 50
- inputText: "georgette"
- tapOn: "georgette"
- tapOn: "hod\nBoutique\ngeorgette\n₹14"
- tapOn: "Add To Cart"
- assertVisible: "Attention: New Store Selected"
- assertVisible: "Your cart contains items from a different store. To add products from this store, you must either complete your current order or clear your cart."
