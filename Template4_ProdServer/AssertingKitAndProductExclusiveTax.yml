appId: com.rupee.template_four
---
- launchApp
- tapOn: "Store name or a product..."
- tapOn: "Search Products"
- inputText: "one stop_at"
- tapOn: "One Stop_AT\n0.0\nKukatpally"
#Product
- tapOn: "Search Products"
- inputText: "branded rtn ex"
- tapOn: "branded Rtn Ex"
- tapOn: "dssd

    One stop_at

    branded Rtn Ex

    ₹25.50"
- tapOn: "Add To Cart"
- tapOn:
    point: "6%,7%"
#Kit
- tapOn: "Search Products"
- eraseText: 50
- inputText: "kit exc"
- tapOn: "Kit Exc"
- tapOn: "₹14.20

    One stop_at

    Kit Exc

    Total: 3 packs"
- tapOn: "Add To Cart"
- tapOn:
    point: "7%,8%"
- tapOn: "2\nCart"
- scrollUntilVisible:
    element: "Note: Cancellation must be requested 24 hours prior."
    direction: DOWN
- assertVisible: "Tax"
- assertVisible: "₹0.28"
- tapOn: "Pay via\nSelect payment mode"
- tapOn: "Cash On Delivery"
- tapOn:
    point: "6%,7%"
- tapOn: "Place Order"
- tapOn: "Settings"
- tapOn: "My Orders"
- tapOn: "View Order Summary"
- assertVisible: "Process\nbranded Rtn Ex\n₹25.50"
- assertVisible: "Process\nKit Exc\n₹14.48"
