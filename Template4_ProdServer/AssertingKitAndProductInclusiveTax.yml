appId: com.rupee.template_four
---
- launchApp
- tapOn: "Store name or a product..."
- tapOn: "Search Products"
- inputText: "one stop_at"
- tapOn: "One Stop_AT\n0.0\nKukatpally"
#Product
- tapOn: "Search Products"
- inputText: "kurtis"
- tapOn: "Kurtis"
- tapOn: "One stop_at\nKurtis\n₹109.67"
- tapOn: "Add To Cart"
- tapOn:
    point: "6%,7%"
#Kit
- tapOn: "Search Products"
- eraseText: 50
- inputText: "kit inc"
- tapOn: "Kit Inc"
- tapOn: "₹24.60

    One stop_at

    Kit Inc

    Total: 3 packs"
- tapOn: "Add To Cart"
- tapOn:
    point: "7%,8%"
- tapOn: "2\nCart"
- scrollUntilVisible:
    element: "Note: Cancellation must be requested 24 hours prior."
    direction: DOWN
- assertVisible: "Tax"
- assertVisible: "₹0"  
- tapOn: "Pay via\nSelect payment mode"
- tapOn: "Cash On Delivery"
- tapOn:
    point: "6%,7%"
- tapOn: "Place Order"
- tapOn: "Settings"
- tapOn: "My Orders"
- tapOn: "View Order Summary"
- assertVisible: "Process\nKurtis\n₹109.67"
- assertVisible: "Process\nKit Inc\n₹49.20"
