appId: com.rupee.template_four
---
- launchApp
- tapOn: "Store name or a product..."
- tapOn: "Search Products"
- inputText: "handcrafts"
- tapOn: "HandCrafts\n0.0\nRK Beach Road"
- tapOn: "Search Products"
- inputText: "Flower ib"
- tapOn: "Flower IB"
- tapOn: "₹69

    Handcrafts

    Flower IB

    Total: 2 packs"
- assertVisible: "₹69"
- tapOn: "Add To Cart"
- tapOn:
    point: "7%,8%"
- tapOn: "1\nCart"
- assertVisible: "Flower IB\n x 2\n₹138"
- tapOn: "Apply Coupons"
- tapOn: "₹3

    COUPONRP

    Tap To Apply

    Expire - May 23, 2025

    Cart Amount ₹20

    HandCrafts"
#- tapOn: "Tap To Apply" - not working 
- tapOn: "Pay via\nSelect payment mode"
- tapOn: "Cash On Delivery"
- tapOn:
    point: "6%,7%"
- tapOn: "Place Order"
- tapOn: "Settings"
- tapOn: "My Orders"
- tapOn: "View Order Summary"
- assertVisible: "Process\nFlower IB\n₹142.14"
- tapOn: "Cancel"
- tapOn: "Info

    Cannot cancel the order because it contains non-returnable items."
