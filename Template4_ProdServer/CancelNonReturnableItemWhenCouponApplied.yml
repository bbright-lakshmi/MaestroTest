appId: com.rupee.template_four
---
- launchApp
- tapOn: "Store name or a product..."
- tapOn: "Search Products"
- inputText: "one stop_at"
- tapOn: "One Stop_AT\n0.0\nKukatpally"
#Kit
- tapOn: "Search Products"
- inputText: "kit inc"
- tapOn: "Kit Inc"
- tapOn: "₹24.60

    One stop_at

    Kit Inc

    Total: 3 packs"
- tapOn: "Add To Cart"
- back
#Product
- tapOn: "Kit Inc"
- eraseText: 50
- inputText: "shimmer"
- tapOn: "Shimmer"
- tapOn: "One stop_at\nShimmer\n₹45.90"
- tapOn: "2\nCart"
- tapOn: "Apply Coupons"
#- tapOn: "4 %

#    COUPONWN

#    Tap To Apply

#    Expire - Jun 15, 2025

#    Cart Amount ₹20

#    One Stop_AT"
- tapOn:
    point: "50%,18%"
- scrollUntilVisible:
    element: "Note: Cancellation must be requested 24 hours prior."
    direction: DOWN
- tapOn: "Pay via\nSelect payment mode"
- tapOn: "Cash On Delivery"
- tapOn:
    point: "6%,7%"
- tapOn: "Place Order"
- tapOn: "Settings"
- tapOn: "My Orders"
- tapOn: "View Order Summary"
- assertVisible: "Process\nKit Inc\n₹49.20"
- assertVisible: "Shimmer\ner x 1\n₹45.90"
- tapOn:
    text: "Cancel"
    index: 0
- tapOn: "Info

    Cannot cancel the order because it contains non-returnable items."