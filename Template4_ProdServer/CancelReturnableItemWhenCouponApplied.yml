appId: com.rupee.template_four
---
- launchApp
- tapOn: "Store name or a product..."
- tapOn: "Search Products"
- inputText: "one stop_at"
- tapOn: "One Stop_AT\n0.0\nKukatpally"
- tapOn: "Search Products"
- inputText: "kit rtn"
- tapOn: "Kit rtn"
- tapOn: "₹50

    One stop_at

    kit rtn

    Total: 1 packs"
- tapOn: "Add To Cart"
- tapOn:
    point: "7%,8%"
- tapOn: "1\nCart"
- assertVisible: "kit rtn\n x 1\n₹50"
- tapOn: "Apply Coupons"
- tapOn: "4 %

    COUPONWN

    Tap To Apply

    Expire - Jun 15, 2025

    Cart Amount ₹20

    One Stop_AT"
#- tapOn:
#    point: "50%,18%"
#- tapOn: "Tap To Apply" - not working 
- tapOn: "Pay via\nSelect payment mode"
- tapOn: "Cash On Delivery"
- tapOn:
    point: "6%,7%"
- tapOn: "Place Order"
- tapOn: "Settings"
- tapOn: "My Orders"
- tapOn: "View Order Summary"
- assertVisible: "Process\nAnarkali Ib\n₹21.84"
- assertVisible: "Process\nAnarkali Ib\n₹33.18"
- tapOn: "Cancel"
- assertVisible: "Coupon Applied"
- assertVisible: "A coupon has been applied to this order. The entire order must be canceled. Do you want to cancel the entire order?"
- assertVisible: "Info

    The entire order has been canceled."
    