appId: com.rupee.template_four
---
- launchApp
- tapOn: "Store name or a product..."
- tapOn: "Search Products"
- inputText: "one stop_at"
- tapOn: "One Stop_AT\n0.0\nKukatpally"
- tapOn: "Search Products"
- inputText: "shimmer"
- tapOn: "Shimmer"
- tapOn: "One stop_at\nShimmer\n₹45.90"
- tapOn: "Add To Cart"
- tapOn: "1\nCart"
- tapOn: "Apply Coupons"
#- tapOn: "4 %

#    COUPONWN

#    Tap To Apply

#    Expire - Jun 15, 2025

#    Cart Amount ₹20

#    One Stop_AT"

#- tapOn:
#    containsDescendants:
#      - text: "Tap To Apply"
#    index: 1  # Optional: targets second occurrence

- tapOn:
    point: "50%,18%"
- tapOn:
    point: "6%,7%"
- scrollUntilVisible:
    element: "Note: Cancellation must be requested 24 hours prior."
    direction: DOWN
- assertVisible: "Coupon"
- assertVisible: "₹1.84"
- tapOn: "Pay via\nSelect payment mode"
- tapOn: "Cash On Delivery"
- tapOn:
    point: "6%,7%"
- tapOn: "Place Order"
- tapOn: "Settings"
- tapOn: "My Orders"
- tapOn: "View Order Summary"
- assertVisible: "Shimmer\ner x 1\n₹45.90"
- assertVisible: "Shimmer\ner x 1\n₹45.90"
- scrollUntilVisible:
    element: "Cash On Delivery"
    direction: DOWN
- assertVisible: "Payment Details

    Package Cost

    ₹10

    Delivery Cost

    ₹6659.15

    Discount

    ₹0

    Payment Mode

    Cash On Delivery

    Coupon

    COUPONWN

    Coupon Amount

    ₹1.84

    Tax

    ₹0

    Total Savings

    ₹1.84

    Total Amount

    ₹6713.21"
