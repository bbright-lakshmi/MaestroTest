appId: com.rupee.template_four
---
- launchApp
- tapOn: "Store name or a product..."
- tapOn: "Search Products"
- inputText: "one stop_at"
- tapOn: "One Stop_AT\n0.0\nKukatpally"
- tapOn: "Search Products"
- inputText: "kit exc"
- tapOn: "Kit Exc"
- tapOn: "₹14.20

    One stop_at

    Kit Exc

    Total: 3 packs"
- assertVisible: "₹14.20"
- tapOn: "Add To Cart"
- assertVisible: "Success\nItem added to cart"
- back
- tapOn: "1\nCart"
- assertVisible: "Kit Exc\n x 3\n₹42.60"
- scrollUntilVisible:
    element: "Note: Cancellation must be requested 24 hours prior."
    direction: DOWN
- assertVisible: "Cart Total (1 Item)"
- assertVisible: "₹42.60"
- tapOn: "Pay via\nSelect payment mode"
- tapOn: "Cash On Delivery"
- tapOn:
    point: "6%,7%"
- tapOn: "Place Order"
- tapOn: "Settings"
- tapOn: "My Orders"
- tapOn: "View Order Summary"
- assertVisible: "Process\nKit Exc\n₹43.45"