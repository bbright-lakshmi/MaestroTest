appId: com.rupee.template_four
---
- launchApp
- tapOn: "Store name or a product..."
- tapOn: "Search Products"
- inputText: "one stop_at"
- tapOn: "One Stop_AT\n0.0\nKukatpally"
- tapOn: "Search Products"
- inputText: "kit inc"
- tapOn: "Kit Inc"
- tapOn: "₹24.60

    One stop_at

    Kit Inc

    Total: 3 packs"
- assertVisible: "₹24.60"
- tapOn: "Add To Cart"
- tapOn:
    point: "7%,8%"
- tapOn: "1\nCart"
- assertVisible: "Kit Inc\n x 2\n₹49.20"
- tapOn: "Pay via\nSelect payment mode"
- tapOn: "Cash On Delivery"
- tapOn:
    point: "6%,7%"
- tapOn: "Place Order"
- tapOn: "Settings"
- tapOn: "My Orders"
- tapOn: "View Order Summary"
- assertVisible: "Process\nKit Inc\n₹49.20"
- tapOn: "Cancel"
- assertVisible: "Info\nThis item is not returnable."
