appId: com.rupee.template_four
---
- launchApp
- tapOn: "Store name or a product..."
- tapOn: "Search Products"
- inputText: "one stop_at"
- tapOn: "One Stop_AT\n0.0\nKukatpally"
- tapOn: "Search Products"
- inputText: "product returnable"
- tapOn: "product returnable"
- tapOn: "One stop_at\nproduct returnable\n₹28"
- assertVisible: "₹28"
- tapOn: "Add To Cart"
- tapOn: "Success\nItem added to cart"
- tapOn: "2kg"
- assertVisible: "₹43.92"
- tapOn: "Add To Cart"
- tapOn: "Success\nItem added to cart"
- tapOn: "2\nCart"
- assertVisible: "product returnable\nkg x 1\n₹28"
- assertVisible: "product returnable\n2kg x 1\n₹43.92"
- scrollUntilVisible:
    element: "Note: Cancellation must be requested 24 hours prior."
    direction: DOWN
- assertVisible: "Cart Total (2 Item)"
- assertVisible: "₹71.92"
- tapOn: "Pay via\nSelect payment mode"
- tapOn: "Cash On Delivery"
- tapOn:
    point: "6%,7%"
- tapOn: "Place Order"
- tapOn: "Settings"
- tapOn: "My Orders"
- tapOn: "View Order Summary"
- assertVisible: "Process\nproduct returnable\n₹28"
- assertVisible: "Process\nproduct returnable\n₹43.92"