appId: com.rupee.template_four
---
- launchApp
- tapOn: "Store name or a product..."
- tapOn: "Search Products"
- inputText: "one stop_at"
- tapOn: "One Stop_AT\n0.0\nKukatpally"
- tapOn: "Search Products"
- inputText: "kit rtn"
- tapOn: "Kit rtn"
- tapOn: "₹50

    One stop_at

    kit rtn

    Total: 1 packs"
- tapOn: "Add To Cart"
- back
- tapOn: "1\nCart"
- assertVisible: "kit rtn\n x 1\n₹50"
- tapOn: "Pay via\nSelect payment mode"
- tapOn: "Cash On Delivery"
- tapOn:
    point: "6%,7%"
- tapOn: "Place Order"
- tapOn: "Settings"
- tapOn: "My Orders"
- tapOn: "View Order Summary"
- assertVisible: "Process\nkit rtn\n₹50"
- tapOn: "Cancel"
- assertVisible: "Are you sure you want to cancel this item?"
- tapOn: "Yes"
- assertVisible: "Info\nItem canceled successfully."
