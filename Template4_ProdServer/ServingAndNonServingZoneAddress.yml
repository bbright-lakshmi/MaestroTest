appId: com.rupee.template_four
---
- launchApp
- tapOn: "Settings"
- tapOn: "My Addresses"
- assertVisible: "Serving Zone

    Serving Zone

    9876543210"
- tapOn:
    point: "6%,7%"
- tapOn: "Home"
- tapOn: "Store name or a product..."
- tapOn: "Search Products"
- inputText: "handcrafts"
- tapOn: "HandCrafts"
- tapOn: "HandCrafts\n0.0\nRK Beach Road"
- tapOn: "Search Products"
- inputText: "tea coaster"
- tapOn: "Tea coaster"
- tapOn: "Handcrafts\nTea coaster\n₹24"
- tapOn: "Add To Cart"
- tapOn: "Change"
- tapOn: "Non Serving Zone

    Non Serving Zone

    9876543210"
- assertVisible: "Warning

    Cart items removed as they are not available in your serving area"
- tapOn:
    point: "5%,16%"
- assertVisible: "Start Shopping"
- tapOn: "Home"
- extendedWaitUntil:
    visible: "Cart"
    timeout: 5000      
- takeScreenshot: Images/Template4/HomePage