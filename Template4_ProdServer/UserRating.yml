appId: com.rupee.template_four
---
- launchApp
- tapOn: "Store name or a product..."
- tapOn: "Search Products"
- inputText: "one stop_at"
- tapOn: "One Stop_AT\n0.0\nKukatpally"
- tapOn: "Search Products"
- inputText: "kit rtn"
- tapOn: "Kit rtn"
- tapOn: "₹50

    One stop_at

    kit rtn

    Total: 1 packs"
- tapOn: "Add To Cart"
- back
- tapOn: "1\nCart"
- tapOn: "Pay via\nSelect payment mode"
- tapOn: "Cash On Delivery"
- tapOn:
    point: "6%,7%"
- tapOn: "Place Order"
- tapOn: "Settings"
- tapOn: "My Orders"
- tapOn: "View Order Summary"
- tapOn: "Cancel"
- assertVisible: "Are you sure you want to cancel this item?"
- tapOn: "Yes"
- tapOn: "View Order Summary"
- tapOn: "Cancel\nkit rtn\n₹50"
- tapOn: "Rating"
- tapOn:
    point: "62%,87%"
- tapOn: "Save"
- assertVisible: "Success

    Your rating matters to us. Thank you for your valuable feedback."
- tapOn:
    point: "6%,7%"
- tapOn: "Home"
- tapOn:
    id: "com.google.android.inputmethod.latin:id/0_resource_name_obfuscated"
    index: 56
- tapOn: "₹50

    One stop_at

    kit rtn

    Total: 1 packs"
- extendedWaitUntil:
    visible: "Add to Cart"
    timeout: 5000      
- takeScreenshot: Images/Template4_ProdServer/UserRating