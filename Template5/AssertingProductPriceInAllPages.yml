appId: com.rupee.template_five
---
- launchApp
- tapOn: "Search Stores"
- inputText: "Template 5"
- assertVisible: "Template 5\nChikkamagaluru"
- tapOn: "Template 5\nChikkamagaluru"
- tapOn: "Search"
- tapOn:
    point: "50%,8%"
- inputText: "sticks"
- tapOn: "Sticks"
- tapOn: "NV\nSticks\ns1 x 1\n₹18"
- assertVisible: "s1"
- assertVisible: "₹18"
- tapOn: "Add To Cart"
- tapOn: "s2"
- assertVisible: "₹24"
- tapOn: "Add To Cart"
- tapOn: "s3"
- assertVisible: "₹35"
- tapOn: "Add To Cart"
- tapOn: "Cart\n3"
- assertVisible: "Sticks\ns1 x 1\n₹18"
- assertVisible: "Sticks\ns2 x 1\n₹24"
- assertVisible: "Sticks\ns3 x 1\n₹35"
- assertVisible: "Cart Total (3 Item)"
- assertVisible: "₹77"
- tapOn: "Proceed to checkout"
- tapOn: "Cash On Delivery"
- tapOn: "Place Order"
- tapOn: "Profile"
- tapOn: "My Orders"
- tapOn: "View Order Summary"
- assertVisible: "Process\nSticks\n₹18"
- assertVisible: "Process\nSticks\n₹24"
- assertVisible: "Process\nSticks\n₹35"
- tapOn: "Scrim"
- tapOn:
    point: "94%,30%"
- scrollUntilVisible:
    element: "Process\nSticks\n₹35"
    direction: DOWN
- assertVisible: "Process\nSticks\n₹18"
- assertVisible: "Process\nSticks\n₹24"
- assertVisible: "Process\nSticks\n₹35"