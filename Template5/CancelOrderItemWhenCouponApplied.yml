appId: com.rupee.template_five
---
- launchApp
- tapOn: "Search Stores"
- inputText: "Template 5"
- assertVisible: "Template 5\nChikkamagaluru"
- tapOn: "Template 5\nChikkamagaluru"
- tapOn: "Search"
- tapOn:
    point: "50%,8%"
- inputText: "paneer"
- tapOn: "Paneer"
- tapOn: "Veg\nPaneer\n1v x 1\n₹33.99"
- tapOn: "Add To Cart"
- tapOn: "Cart\n1"
- tapOn: "Please select coupon"
- tapOn: "2 %

    OFF

    Template 5

    Coupon Code

    VEGCOUPN

    Cart Amount ₹30

    Expire - Mar 30, 2025"
- tapOn: "Scrim"
- assertVisible: "VEGCOUPN"
- tapOn: "Proceed to checkout"
- tapOn: "Cash On Delivery"
- tapOn: "Profile"
- tapOn: "My Orders"
- tapOn: "View Order Summary"
- assertVisible: "Process\nPaneer\n₹33.99"
- tapOn: "Cancel"
- tapOn: "Info

    Cannot cancel the order because it contains non-returnable items."