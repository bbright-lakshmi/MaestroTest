appId: com.rupee.template_five
---
- launchApp
- tapOn: "Search Stores"
- inputText: "Template5"
- tapOn: "Template5\nHyderabad Tg"
- tapOn: "Search"
- tapOn: "Count 1\nWithtaxKit\n1 x 1\n₹10"
- tapOn: "Add To Cart"
- tapOn:
    point: "9%,8%"
- tapOn: "Count 1\nWithoutTax\n1 x 1\n₹10"
- tapOn: "Add To Cart"
- tapOn: "Cart\n2"
- tapOn: "Please select coupon"
- tapOn: "10 %

    OFF

    Template5

    Coupon Code

    COUPONQ2

    Cart Amount ₹20

    Expire - Mar 26, 2025"
- tapOn: "Scrim"
- tapOn: "Proceed to checkout"
- tapOn: "Cash On Delivery"
- tapOn: "Place Order"
- assertVisible: "Success\nOrder placed successfully"
- tapOn: "Profile"
- tapOn: "My Orders"
- extendedWaitUntil:
    visible: "View Order Summary"
    timeout: 5000
- takeScreenshot: Images/Template5/OrderPlaced
- tapOn: "Search"
- tapOn: "Add To Cart"
- tapOn:
    point: "9%,8%"
- tapOn: "Count 1\nWithtaxKit\n1 x 1\n₹10"
- tapOn: "Add To Cart"
- tapOn: "Cart\n2"
- tapOn: "Please select coupon"
- scrollUntilVisible:
    element: "COUPONQ2"
    direction: DOWN
- tapOn: "10 %

    OFF

    Template5

    Coupon Code

    COUPONQ2

    Cart Amount ₹20

    Expire - Mar 26, 2025"
- assertVisible: "Info
 
    Coupon already applied for this user Mobile number"  







